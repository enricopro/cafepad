<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <defs>
    <!-- Standard draw.io marker arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#495057"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc3545"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6c757d"/>
    </marker>
    <marker id="arrowDashedStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#6c757d"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .lane-title { font-size: 12px; font-weight: 700; fill: #495057; }
    .box-title { font-size: 13px; font-weight: 700; fill: #212529; }
    .box-body { font-size: 11px; fill: #495057; }
    .lbl-bg { fill: #ffffff; stroke: #ced4da; stroke-width: 1px; rx: 4px; }
    .lbl-text { font-size: 10px; font-weight: 600; fill: #495057; text-anchor: middle; }
    .lbl-red { font-size: 9.5px; font-weight: 700; fill: #b02a37; text-anchor: middle; }
  </style>

  <!-- Clean Canvas Background -->
  <rect width="920" height="620" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="6"/>

  <!-- ================= 1. HARDWARE LAYER ================= -->
  <g transform="translate(65, 20)">
    <rect width="825" height="85" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4" rx="6"/>
    <rect width="825" height="24" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="6"/>
    <text x="12" y="16" class="lane-title">1. Physical Hardware Layer</text>

    <!-- Node: Controller -->
    <g transform="translate(15, 30)">
      <rect width="795" height="46" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
      <text x="16" y="18" class="box-title">Wii U Pro Controller (OEM &amp; Third-Party Clones)</text>
      <text x="16" y="34" class="box-body">• Broadcasts on Limited Inquiry Access Code (LIAC 0x9E8B00)  • 12-bit ADC sticks &amp; buttons  • 90s firmware sleep watchdog</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 (Downwards) -->
  <g transform="translate(285, 105)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="-105" y="11" width="210" height="18" class="lbl-bg"/>
    <text x="0" y="23" class="lbl-text">Over-the-Air Bluetooth 2.1+EDR</text>
  </g>

  <!-- ================= 2. LINUX HOST SYSTEM ================= -->
  <g transform="translate(65, 145)">
    <rect width="825" height="315" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4" rx="6"/>
    <rect width="825" height="24" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="6"/>
    <text x="12" y="16" class="lane-title">2. Linux Host System (Kernel &amp; Userspace)</text>

    <!-- Node: BlueZ -->
    <g transform="translate(15, 32)">
      <rect width="375" height="54" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
      <text x="14" y="18" class="box-title">Linux Bluetooth Subsystem (BlueZ)</text>
      <text x="14" y="32" class="box-body">• HCI Controller Interface (Intel, Realtek, Broadcom)</text>
      <text x="14" y="45" class="box-body">• L2CAP Dual Channels: PSM 0x11 (Control) &amp; 0x13 (Interrupt)</text>
    </g>

    <!-- Node: Desktop GUI -->
    <g transform="translate(435, 32)">
      <rect width="375" height="54" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
      <text x="14" y="18" class="box-title">CaféPad Desktop GUI (Python / Tkinter)</text>
      <text x="14" y="32" class="box-body">• Real-time 60 FPS analog stick &amp; button visualizer</text>
      <text x="14" y="45" class="box-body">• Battery gauge alerts, 1-click SYNC &amp; systemd toggle</text>
    </g>

    <!-- Edge: BlueZ to Daemon -->
    <line x1="202" y1="86" x2="202" y2="124" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="140" y="96" width="124" height="16" class="lbl-bg"/>
    <text x="202" y="108" class="lbl-text">Raw L2CAP Sockets</text>

    <!-- Edge: Daemon <-> GUI (IPC) -->
    <line x1="622" y1="86" x2="622" y2="124" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDashed)" marker-start="url(#arrowDashedStart)"/>
    <rect x="558" y="96" width="128" height="16" class="lbl-bg"/>
    <text x="622" y="108" class="lbl-text">Telemetry &amp; IPC State</text>

    <!-- Node: CaféPad C99 Daemon Engine -->
    <g transform="translate(15, 126)">
      <rect width="795" height="74" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
      <text x="16" y="18" class="box-title">CaféPad Core Engine (C99 Daemon / libcafepad)</text>
      <text x="16" y="34" class="box-body">• Discovery Engine: Bypasses standard scans; listens directly for LIAC broadcasts (supports OEM &amp; clones)</text>
      <text x="16" y="49" class="box-body">• Report 0x3D Parser: Normalizes 12-bit analog sticks, deadzones &amp; maps buttons (Xbox 360 / Nintendo modes)</text>
      <text x="16" y="64" class="box-body">• Watchdog &amp; Rumble: Sends 0x15 heartbeat to prevent 90s sleep; converts EV_FF ioctls to 0x11 motor packets</text>
    </g>

    <!-- Edge: Daemon to uinput -->
    <line x1="412" y1="200" x2="412" y2="236" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="337" y="209" width="150" height="16" class="lbl-bg"/>
    <text x="412" y="221" class="lbl-text">Virtual Device Registration</text>

    <!-- Node: Kernel /dev/uinput -->
    <g transform="translate(15, 238)">
      <rect width="795" height="52" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
      <text x="16" y="18" class="box-title">Linux Kernel Virtual Input Subsystem (/dev/uinput)</text>
      <text x="16" y="33" class="box-body">• Exposes standard virtual Xbox 360 controller nodes (/dev/input/event* &amp; /dev/input/js*)</text>
      <text x="16" y="46" class="box-body">• Pushes normalized axis/button inputs to OS; exposes EV_FF force-feedback rumble ioctls</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 (Downwards) -->
  <g transform="translate(477, 460)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="-105" y="11" width="210" height="18" class="lbl-bg"/>
    <text x="0" y="23" class="lbl-text">Standard Linux Evdev &amp; Joystick Events</text>
  </g>

  <!-- ================= 3. APPLICATION & GAMES LAYER ================= -->
  <g transform="translate(65, 500)">
    <rect width="825" height="100" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4" rx="6"/>
    <rect width="825" height="24" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="6"/>
    <text x="12" y="16" class="lane-title">3. User Applications &amp; Games Layer</text>

    <!-- Node: Steam -->
    <g transform="translate(15, 32)">
      <rect width="375" height="56" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
      <text x="14" y="18" class="box-title">Steam / Proton / Wine Games</text>
      <text x="14" y="33" class="box-body">• Native Xbox 360 gamepad plug-and-play detection</text>
      <text x="14" y="47" class="box-body">• In-game physical vibration rumble support (EV_FF)</text>
    </g>

    <!-- Node: Emulators -->
    <g transform="translate(435, 32)">
      <rect width="375" height="56" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
      <text x="14" y="18" class="box-title">Emulators &amp; Native Linux Titles</text>
      <text x="14" y="33" class="box-body">• Cemu, Dolphin, RPCS3, PCSX2, RetroArch</text>
      <text x="14" y="47" class="box-body">• Standard SDL2 and /dev/input gamepad APIs</text>
    </g>
  </g>

  <!-- Reverse Rumble Loop (Red Dashed Line in Left Margin) -->
  <path d="M 80 560 L 25 560 L 25 308 L 78 308" fill="none" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <g transform="translate(25, 434) rotate(-90)">
    <rect x="-70" y="-10" width="140" height="20" class="lbl-bg" stroke="#f5c2c7"/>
    <text x="0" y="3.5" class="lbl-red">FF_RUMBLE Feedback</text>
  </g>
</svg>