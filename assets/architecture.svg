<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowDownIndigo" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 8 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowDownEmerald" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrowDownAmber" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 8 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowUpPink" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 8 L 10 8 L 5 0 z" fill="#ec4899"/>
    </marker>
  </defs>

  <style>
    .card { rx: 14px; stroke-width: 1.5px; filter: url(#shadow); }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
    .arrow-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Main Canvas -->
  <rect width="900" height="670" rx="18" fill="url(#canvasBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ================= STAGE 1: Physical Controller ================= -->
  <g transform="translate(60, 25)">
    <rect width="470" height="92" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.8" class="card"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="60" height="60" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Controller Vector Icon -->
    <g transform="translate(24, 23)" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 14 C6 8, 10 4, 22 4 L22 4 C34 4, 38 8, 38 14 C38 25, 40 36, 33 39 C30 41, 27 35, 25 31 C24 28, 20 28, 19 31 C17 35, 14 41, 11 39 C4 36, 6 25, 6 14 Z" fill="#0f172a"/>
      <circle cx="15" cy="14" r="3.2" fill="#38bdf8"/>
      <circle cx="29" cy="14" r="3.2" fill="#38bdf8"/>
      <path d="M15 22 L15 28 M12 25 L18 25"/>
      <circle cx="29" cy="22" r="0.8" fill="#38bdf8"/>
      <circle cx="32" cy="25" r="0.8" fill="#38bdf8"/>
      <circle cx="26" cy="25" r="0.8" fill="#38bdf8"/>
      <circle cx="29" cy="28" r="0.8" fill="#38bdf8"/>
    </g>
    <!-- Text -->
    <text x="92" y="34" class="title">1. Wii U Pro Controller (Hardware)</text>
    <text x="92" y="53" class="desc">Buttons, symmetrical analog sticks &amp; rumble motors</text>
    <rect x="92" y="62" width="100" height="20" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <text x="142" y="76" text-anchor="middle" class="badge-text" fill="#7dd3fc">OEM &amp; Clones</text>
    <rect x="200" y="62" width="105" height="20" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <text x="252" y="76" text-anchor="middle" class="badge-text" fill="#7dd3fc">80h Battery Life</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(295, 117)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowDown)"/>
    <rect x="-95" y="10" width="190" height="20" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" class="arrow-badge" fill="#38bdf8">Bluetooth LIAC (2.4 GHz)</text>
  </g>

  <!-- ================= STAGE 2: Bluetooth Subsystem ================= -->
  <g transform="translate(60, 157)">
    <rect width="470" height="92" fill="url(#cardBg)" stroke="#6366f1" stroke-opacity="0.8" class="card"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="60" height="60" rx="12" fill="#4338ca" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1.5"/>
    <!-- Bluetooth Vector Icon -->
    <g transform="translate(33, 24)" stroke="#818cf8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 L12 36 L24 25 L5 12 L24 12 L12 4 L5 28 L24 16"/>
    </g>
    <!-- Text -->
    <text x="92" y="34" class="title">2. PC Bluetooth Host Adapter</text>
    <text x="92" y="53" class="desc">Standard internal Bluetooth (Intel, Realtek, Broadcom)</text>
    <rect x="92" y="62" width="112" height="20" rx="10" fill="#4338ca" fill-opacity="0.35"/>
    <text x="148" y="76" text-anchor="middle" class="badge-text" fill="#c7d2fe">Zero Dongles</text>
    <rect x="212" y="62" width="125" height="20" rx="10" fill="#4338ca" fill-opacity="0.35"/>
    <text x="274" y="76" text-anchor="middle" class="badge-text" fill="#c7d2fe">Dynamic Inquiry</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(295, 249)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowDownIndigo)"/>
    <rect x="-105" y="10" width="210" height="20" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" class="arrow-badge" fill="#a5b4fc">Dual L2CAP (HID 0x11 / 0x13)</text>
  </g>

  <!-- ================= STAGE 3: CaféPad Driver Engine ================= -->
  <g transform="translate(60, 289)">
    <rect width="470" height="92" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.9" class="card"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="60" height="60" rx="12" fill="#065f46" fill-opacity="0.25" stroke="#059669" stroke-width="1.5"/>
    <!-- Microchip Vector Icon -->
    <g transform="translate(25, 24)" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="24" height="24" rx="4" fill="#064e3b"/>
      <path d="M15 17 L27 17 M15 21 L27 21 M15 25 L22 25"/>
      <path d="M14 5 L14 9 M21 5 L21 9 M28 5 L28 9"/>
      <path d="M14 33 L14 37 M21 33 L21 37 M28 33 L28 37"/>
      <path d="M5 14 L9 14 M5 21 L9 21 M5 28 L9 28"/>
      <path d="M33 14 L37 14 M33 21 L37 21 M33 28 L37 28"/>
    </g>
    <!-- Text -->
    <text x="92" y="34" class="title">3. CaféPad C99 Daemon Engine</text>
    <text x="92" y="53" class="desc">Decodes report 0x3D, normalizes axes &amp; keeps alive</text>
    <rect x="92" y="62" width="94" height="20" rx="10" fill="#064e3b" fill-opacity="0.5"/>
    <text x="139" y="76" text-anchor="middle" class="badge-text" fill="#6ee7b7">Pure C Core</text>
    <rect x="194" y="62" width="115" height="20" rx="10" fill="#064e3b" fill-opacity="0.5"/>
    <text x="251" y="76" text-anchor="middle" class="badge-text" fill="#6ee7b7">Watchdog Active</text>
  </g>

  <!-- Sidecar Connection (Engine to Desktop GUI) -->
  <g transform="translate(530, 335)">
    <line x1="8" y1="0" x2="62" y2="0" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="70,0 59,-4.5 59,4.5" fill="#a855f7"/>
    <polygon points="0,0 11,-4.5 11,4.5" fill="#a855f7"/>
    <rect x="17" y="-20" width="44" height="17" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
    <text x="39" y="-8" text-anchor="middle" class="badge-text" fill="#e9d5ff">IPC</text>
  </g>

  <!-- ================= SIDECAR: Desktop GUI ================= -->
  <g transform="translate(600, 289)">
    <rect width="240" height="92" fill="url(#cardBg)" stroke="#a855f7" stroke-opacity="0.8" class="card"/>
    <!-- Icon Container -->
    <rect x="14" y="16" width="56" height="60" rx="12" fill="#581c87" fill-opacity="0.25" stroke="#7e22ce" stroke-width="1.5"/>
    <!-- Desktop Window Vector Icon -->
    <g transform="translate(21, 24)" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="34" height="28" rx="4" fill="#2e1065"/>
      <line x1="4" y1="14" x2="38" y2="14"/>
      <circle cx="9" cy="10" r="1.2" fill="#f43f5e" stroke="none"/>
      <circle cx="14" cy="10" r="1.2" fill="#facc15" stroke="none"/>
      <circle cx="19" cy="10" r="1.2" fill="#22c55e" stroke="none"/>
      <circle cx="16" cy="23" r="4.5" stroke="#a855f7"/>
      <line x1="16" y1="20" x2="16" y2="26"/>
      <line x1="13" y1="23" x2="19" y2="23"/>
      <rect x="25" y="21" width="8" height="5" rx="1"/>
    </g>
    <!-- Text -->
    <text x="80" y="34" class="title">CaféPad GUI</text>
    <text x="80" y="53" class="desc">Battery &amp; stick test</text>
    <rect x="80" y="62" width="95" height="20" rx="10" fill="#581c87" fill-opacity="0.5"/>
    <text x="127" y="76" text-anchor="middle" class="badge-text" fill="#e9d5ff">Desktop App</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(295, 381)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#10b981" stroke-width="2" marker-end="url(#arrowDownEmerald)"/>
    <rect x="-95" y="10" width="190" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" class="arrow-badge" fill="#6ee7b7">Kernel /dev/uinput Node</text>
  </g>

  <!-- ================= STAGE 4: Virtual Xbox Controller ================= -->
  <g transform="translate(60, 421)">
    <rect width="470" height="92" fill="url(#cardBg)" stroke="#f59e0b" stroke-opacity="0.85" class="card"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="60" height="60" rx="12" fill="#78350f" fill-opacity="0.25" stroke="#b45309" stroke-width="1.5"/>
    <!-- Virtual Pad Target Vector Icon -->
    <g transform="translate(24, 24)" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="17" fill="#451a03"/>
      <path d="M13 13 L31 31 M31 13 L13 31" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="22" cy="22" r="6" fill="#0f172a" stroke="#fbbf24"/>
    </g>
    <!-- Text -->
    <text x="92" y="34" class="title">4. Virtual Xbox 360 Gamepad</text>
    <text x="92" y="53" class="desc">Standard /dev/input/event* and js* devices with rumble</text>
    <rect x="92" y="62" width="105" height="20" rx="10" fill="#78350f" fill-opacity="0.45"/>
    <text x="144" y="76" text-anchor="middle" class="badge-text" fill="#fde68a">Native Evdev</text>
    <rect x="205" y="62" width="120" height="20" rx="10" fill="#78350f" fill-opacity="0.45"/>
    <text x="265" y="76" text-anchor="middle" class="badge-text" fill="#fde68a">Layout Switchable</text>
  </g>

  <!-- Arrow 4 to 5 (Bidirectional with Rumble) -->
  <g transform="translate(295, 513)">
    <!-- Forward Input Arrow (Down) -->
    <line x1="-25" y1="0" x2="-25" y2="40" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDownAmber)"/>
    <!-- Reverse Rumble Arrow (Up) -->
    <line x1="25" y1="40" x2="25" y2="5" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowUpPink)"/>
    <rect x="-105" y="10" width="210" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" class="arrow-badge" fill="#f1f5f9">Input Events &amp; Force Feedback</text>
  </g>

  <!-- ================= STAGE 5: Games & Steam ================= -->
  <g transform="translate(60, 553)">
    <rect width="470" height="92" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.9" class="card"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="60" height="60" rx="12" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Steam / Gaming Arcade Vector Icon -->
    <g transform="translate(24, 24)" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="7" width="32" height="24" rx="4" fill="#0c4a6e"/>
      <polygon points="17,14 26,19 17,24" fill="#38bdf8" stroke="none"/>
      <path d="M13 31 L9 39 L35 39 L31 31"/>
    </g>
    <!-- Text -->
    <text x="92" y="34" class="title">5. Steam, Emulators &amp; Games</text>
    <text x="92" y="53" class="desc">Cemu, Dolphin, RPCS3, Proton &amp; native Linux games</text>
    <rect x="92" y="62" width="135" height="20" rx="10" fill="#0369a1" fill-opacity="0.35"/>
    <text x="159" y="76" text-anchor="middle" class="badge-text" fill="#7dd3fc">Plug &amp; Play Ready</text>
    <rect x="235" y="62" width="105" height="20" rx="10" fill="#0369a1" fill-opacity="0.35"/>
    <text x="287" y="76" text-anchor="middle" class="badge-text" fill="#7dd3fc">Haptic Motors</text>
  </g>
</svg>